          {{ z[0].get('on', false) if z else false }}
        level: >
          {% set z = (state_attr('sensor.rgb_controller_status', 'zones') or []) | selectattr('id', 'eq', 1) | list %}
          {{ z[0].get('brightness_ha', 0) | int(0) if z else 0 }}
        rgb: >
          {% set z = (state_attr('sensor.rgb_controller_status', 'zones') or []) | selectattr('id', 'eq', 1) | list %}
          {% set c = (z[0].get('color', '#000000') | string).replace('#', '') if z else '000000' %}
          ({{ c[0:2] | int(0, 16) }}, {{ c[2:4] | int(0, 16) }}, {{ c[4:6] | int(0, 16) }})
        effect: >
          {% set z = (state_attr('sensor.rgb_controller_status', 'zones') or []) | selectattr('id', 'eq', 1) | list %}
          {{ z[0].get('pattern_name', 'SOLID') if z else 'SOLID' }}
        effect_list: "{{ state_attr('sensor.rgb_controller_status', 'patterns') or [] }}"
        turn_on: { action: rest_command.smart_rgb_zone_command, data: { zone: 1, cmd: ON } }
        turn_off: { action: rest_command.smart_rgb_zone_command, data: { zone: 1, cmd: OFF } }
        set_level: { action: rest_command.smart_rgb_zone_command, data: { zone: 1, brightness_ha: "{{ brightness | int(0) }}" } }
        set_rgb: { action: rest_command.smart_rgb_zone_command, data: { zone: 1, r: "{{ r | int(0) }}", g: "{{ g | int(0) }}", b: "{{ b | int(0) }}" } }
        set_effect: { action: rest_command.smart_rgb_zone_command, data: { zone: 1, pattern: "{{ effect }}" } }

      - name: RGB Zone PC Case
        unique_id: rgb_zone_pc_case
        optimistic: true
        availability: "{{ has_value('sensor.rgb_controller_status') and (state_attr('sensor.rgb_controller_status', 'zones') or []) | selectattr('id', 'eq', 2) | list | length > 0 }}"
