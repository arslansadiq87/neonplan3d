  - number:
      - name: RGB Zone Wall Speed
        unique_id: rgb_zone_wall_speed
        min: 1
        max: 200
        step: 1
        state: "{{ ((state_attr('sensor.rgb_controller_status', 'zones') or []) | selectattr('id', 'eq', 0) | list | first | default({})).get('frame_ms', 20) }}"
        set_value: { action: rest_command.smart_rgb_zone_command, data: { zone: 0, speed: "{{ value | int }}" } }
      - name: RGB Zone Monitors Speed
        unique_id: rgb_zone_monitors_speed
